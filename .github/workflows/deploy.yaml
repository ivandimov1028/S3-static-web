name: Deploy to S3

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::997498697952:role/GitHub-StaticWebsiteS3-OIDC-role
          aws-region: eu-central-1

      - name: Sync to S3
        run: aws s3 sync dist/ s3://staticweb-bucket-ivan  --delete 


      - name: Invalidate CloudFront
        if: false
        run: |
          aws cloudfront create-invalidation \
            --distribution-id YOUR_DISTRIBUTION_ID \
            --paths "/*"
            
